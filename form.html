<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description" content="WDD 131 | W05 Assignment: Product Review Form">
    <meta name="author" content="Jorge Lima">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name *</label>

            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset>

                <legend>Overall Rating *</legend>

                <input type="radio" id="one" name="rating" value="1" required>
                <label for="one">☆</label>

                <input type="radio" id="two" name="rating" value="2">
                <label for="two">☆☆</label>

                <input type="radio" id="three" name="rating" value="3">
                <label for="three">☆☆☆</label>

                <input type="radio" id="four" name="rating" value="4">
                <label for="four">☆☆☆☆</label>

                <input type="radio" id="five" name="rating" value="5">
                <label for="five">☆☆☆☆☆</label>

            </fieldset>

            <!-- Date of Install -->
            <label for="installDate">Date of Installation *</label>

            <input type="date" 
            id="installDate" 
            name="installDate" 
            required>

            <!-- Useful Features -->
            <fieldset>

            <legend>Which features did you find useful in the product?

                <br>

                <em>(Check all that apply)</em>

            </legend>

            <input type="checkbox"
            id="durability"
            name="features"
            value="Durability">

            <label for="durability">Durability</label>

            <input
            type="checkbox"
            id="ease"
            name="features"
            value="Ease of Use">

            <label for="ease">Ease of Use</label>

            <input
            type="checkbox"
            id="performance"
            name="features"
            value="Performance">

            <label for="performance">Performance</label>

            <input
            type="checkbox"
            id="design"
            name="features"
            value="Design">

            <label for="design">Design</label>

            </fieldset>

            <!-- Written Review -->
            <label for="review">
            Written Review
            <span class="optional">(Optional)</span>
            </label>

            <textarea
            id="review"
            name="review"
            rows="5">
            </textarea>

            <!-- User Name -->
            <label for="username">
            Your Name
            <span class="optional">(Optional)</span>
            </label>

            <input
            type="text"
            id="username"
            name="username">

            <!-- Submit Button -->
            <input
            type="submit"
            value="Submit Review">

        </form>

    </main>

    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            Jorge Lima
        </p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
